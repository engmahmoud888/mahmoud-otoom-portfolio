const nav=on=>`<header class="top"><a class="brand" data-go="home"><span class="monogram">MO</span><b>Mahmoud Otoom</b></a><nav class="nav">${['home','impact','projects','lead','journey','credentials','contact'].map(x=>`<button class="${on===x?'on':''}" data-go="${x}">${x==='lead'?'How I Lead':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</nav><div class="actions"><a class="connect" href="mailto:eng.otoom@gmail.com">Let's Connect &nbsp;→</a><button class="music">♫</button><button class="menu">☰</button></div></header>`;

const home=`<section class="page active" data-page="home"><div class="wrap">${nav('home')}<div class="hero"><div class="hero-copy"><div class="quote-mark">“</div><h1>I turn complexity into clarity,<br>align people around purpose,<br>and move technology transformation<br>from ambition to measurable impact.</h1><div class="signature">Mahmoud Otoom</div></div><div class="portrait"><img src="mahmoud.jpg" alt="Mahmoud Otoom"><div class="orbit"><span>PEOPLE</span><span>TECHNOLOGY</span><span>IMPACT</span></div></div></div><div class="pills">${pill(1,'STRATEGY','strategy')}${pill(2,'EXECUTION','execution')}${pill(3,'PEOPLE','people')}${pill(4,'IMPACT','impact')}</div><div class="metrics">${metric('14+','Years<br>Experience','',true)}${metric('$100M+','Program<br>Scale','layers')}${metric('100+','Direct Team<br>Scale','people')}${metric('150+','Delivery Ecosystem','network')}<div class="metric wide"><div><span class="ico" style="position:static;float:left;margin-right:16px">${I.globe}</span><strong style="font-size:31px">Multi-Region</strong><span>Global Footprint</span></div><div class="mini-map"><i></i><i></i><i></i><i></i><i></i></div></div></div><div style="height:45px"></div></div></section>`;
const impact=`<section class="page" data-page="impact"><div class="wrap">${nav('impact')}<div class="section"><div class="kicker">IMPACT</div><h1 class="title">Scale, complexity<br>and measurable delivery.</h1><p class="lead">Technology transformation leadership across cybersecurity, IT/ICT infrastructure, digital transformation and telecom environments.</p><div class="impact-top"><div class="donutbox"><div class="donut" data-donut="30"><strong><span>0</span>%</strong></div><div><b>Reduction in Security Incidents</b><p style="color:var(--m)">Measured operational impact</p></div></div><div class="lenses"><div class="lens"><span class="ico">${I.globe}</span><b>GLOBAL DELIVERY</b><span>Cross-region coordination across time zones and cultures</span></div><div class="lens"><span class="ico">${I.strategy}</span><b>GOVERNANCE CONTROL</b><span>RAID, critical path, escalation and decision support</span></div><div class="lens"><span class="ico">${I.execution}</span><b>TRANSFORMATION</b><span>Workflow redesign, Power BI visibility and ERP evaluation</span></div><div class="lens"><span class="ico">${I.network}</span><b>COMPLEX DELIVERY</b><span>Cybersecurity, IT/ICT infrastructure and telecom environments</span></div></div></div><div class="cards">${cards([['GLOBAL DELIVERY','Multi-Region Leadership','Delivery exposure across the Middle East, Europe, East Asia and the Americas, coordinating teams, vendors and stakeholders across time zones and cultures.'],['GOVERNANCE','Executive Control','RAID, dependency management, critical-path impact assessment, escalation, executive reporting and decision support.'],['TRANSFORMATION','From Operations to Insight','Workflow redesign, Power BI management visibility and ERP evaluation as part of an internal digitalization journey.']])}</div></div></div></section>`;
const projects=`<section class="page" data-page="projects"><div class="wrap">${nav('projects')}<div class="section"><div class="kicker">FLAGSHIP TRANSFORMATIONS</div><h1 class="title">Complex delivery.<br>Visible outcomes.</h1><div class="cards">${cards([['01 / DIGITAL TRANSFORMATION','Prosecure Internal Transformation','Engineering workflow redesign → personally developed Power BI management dashboard → ERP requirements and vendor evaluation / selection.'],['02 / OT CYBERSECURITY','SABIC OT Firewall Replacement','Multi-region delivery across time zones, cultures and vendor dependencies, with schedule-impact assessment, escalation and mitigation around hardware/material constraints.'],['03 / TELECOM INFRASTRUCTURE','Orange FTTH','Large-scale network implementation with 100+ direct team members, coordinating resources, subcontractors, suppliers, schedules, quality, KPIs and acceptance.'],['04 / GOVERNANCE','SAMA Compliance','Cross-functional cybersecurity remediation, RAID tracking, governance, executive reporting and escalation.'],['05 / CRITICAL INFRASTRUCTURE','Saudi Energy Program','Cybersecurity delivery spanning Central Data Diode, Multi-Antivirus and OT enhancement initiatives.'],['06 / HIGH-RISK DELIVERY','Al-Madar Long Haul','30+ transmission-team leadership and continuity of field delivery in a high-risk operating environment.']])}</div></div></div></section>`;

function count(page){page.querySelectorAll('.counter').forEach((e,k)=>{const target=+e.dataset.target,fmt=e.dataset.format,start=performance.now()+k*90,dur=1350;function f(t){if(t<start)return requestAnimationFrame(f);let p=Math.min(1,(t-start)/dur),v=Math.round(target*(1-Math.pow(1-p,4)));e.textContent=fmt.replace(String(target),String(v));e.style.animation='countGlow .8s ease';if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)});page.querySelectorAll('[data-donut]').forEach(d=>{let n=d.querySelector('span'),target=+d.dataset.donut,start=performance.now();function f(t){let p=Math.min(1,(t-start)/1200),v=Math.round(target*(1-Math.pow(1-p,4)));n.textContent=v;d.style.setProperty('--d',v*3.6+'deg');if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)})}
function go(name){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));let p=document.querySelector('[data-page="'+name+'"]')||document.querySelector('[data-page="home"]');p.classList.add('active');document.querySelectorAll('.nav').forEach(n=>n.classList.remove('open'));history.replaceState(null,'','#'+name);scrollTo(0,0);setTimeout(()=>count(p),100)}
document.addEventListener('click',e=>{let g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go)}let m=e.target.closest('.menu');if(m)m.closest('.top').querySelector('.nav').classList.toggle('open')});
const audio=document.getElementById('audio');document.addEventListener('click',async e=>{if(e.target.closest('.music')){try{if(audio.paused){audio.volume=.28;await audio.play();e.target.closest('.music').textContent='❚❚'}else{audio.pause();e.target.closest('.music').textContent='♫'}}catch(_){}}});
let initial=location.hash.slice(1);if(initial)go(initial);else count(document.querySelector('.page.active'));
